version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-db
    environment:
      POSTGRES_DB: atlas_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      TZ: Europe/Lisbon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: atlas-cache
    environment:
      - TZ=Europe/Lisbon
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: atlas-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - TZ=Europe/Lisbon

  prometheus:
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    environment:
      - TZ=Europe/Lisbon
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: atlas-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Lisbon
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/provisioning:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres_data:
  redis_data:
  grafana_data: